<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StockSignal AI · 股票諮詢顧問</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:       #07090d;
      --surface:  #0e1117;
      --panel:    #111620;
      --border:   #1c2535;
      --border2:  #243040;
      --accent:   #00d4ff;
      --accent2:  #0099bb;
      --green:    #00e87a;
      --red:      #ff4560;
      --gold:     #f5c842;
      --text:     #cdd5e0;
      --muted:    #4a5870;
      --muted2:   #2a3548;
      --font-d:   'Bebas Neue', sans-serif;
      --font-m:   'DM Mono', monospace;
      --font-b:   'Noto Sans TC', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-b);
      overflow: hidden;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.04) 2px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* ── LAYOUT ── */
    .app {
      display: grid;
      grid-template-columns: 260px 1fr;
      grid-template-rows: 100vh;
      height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 24px 20px 16px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }

    .logo-icon {
      width: 32px; height: 32px;
      border: 1.5px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .logo-icon svg {
      width: 16px; height: 16px;
      stroke: var(--accent); fill: none; stroke-width: 2.5;
    }

    .logo-name {
      font-family: var(--font-d);
      font-size: 22px;
      letter-spacing: 2px;
      color: #fff;
    }

    .logo-name span { color: var(--accent); }

    .logo-sub {
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 2px;
      padding-left: 42px;
    }

    /* New chat button */
    .new-chat-btn {
      margin: 16px 20px;
      padding: 10px 16px;
      background: none;
      border: 1px solid var(--border2);
      color: var(--text);
      font-family: var(--font-m);
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
      width: calc(100% - 40px);
    }

    .new-chat-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .new-chat-btn svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none; stroke-width: 2;
    }

    /* Quick prompts */
    .sidebar-section {
      padding: 0 20px;
      flex: 1;
      overflow-y: auto;
    }

    .section-label {
      font-family: var(--font-m);
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
      margin-top: 20px;
    }

    .quick-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: 1px solid transparent;
      color: var(--muted);
      font-family: var(--font-b);
      font-size: 12px;
      padding: 8px 12px;
      cursor: pointer;
      transition: all 0.15s;
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .quick-btn:hover {
      background: var(--panel);
      border-color: var(--border);
      color: var(--text);
    }

    .quick-btn .qb-ticker {
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--accent);
      display: block;
      margin-bottom: 2px;
    }

    /* Sidebar footer */
    .sidebar-footer {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
    }

    .disclaimer-small {
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted);
      line-height: 1.6;
      letter-spacing: 0.5px;
    }

    /* ── MAIN CHAT ── */
    .chat-area {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      position: relative;
    }

    /* Grid bg */
    .chat-area::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Chat header */
    .chat-header {
      padding: 16px 28px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      z-index: 10;
      flex-shrink: 0;
    }

    .chat-title {
      font-family: var(--font-m);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 2px;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--green);
      letter-spacing: 1px;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* Messages */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 40px;
      gap: 16px;
    }

    .welcome-icon {
      width: 64px; height: 64px;
      border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      margin-bottom: 8px;
    }

    .welcome-icon::before {
      content: '';
      position: absolute; inset: 4px;
      border: 1px solid rgba(0,212,255,0.3);
    }

    .welcome-icon svg {
      width: 28px; height: 28px;
      stroke: var(--accent); fill: none; stroke-width: 2;
    }

    .welcome-title {
      font-family: var(--font-d);
      font-size: 36px;
      letter-spacing: 3px;
      color: #fff;
    }

    .welcome-title span { color: var(--accent); }

    .welcome-sub {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.7;
      max-width: 420px;
    }

    .welcome-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .chip {
      background: var(--panel);
      border: 1px solid var(--border2);
      color: var(--text);
      font-size: 12px;
      padding: 8px 14px;
      cursor: pointer;
      font-family: var(--font-b);
      transition: all 0.15s;
    }

    .chip:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,212,255,0.05);
    }

    /* Message bubbles */
    .msg {
      display: flex;
      gap: 12px;
      max-width: 820px;
      animation: msgIn 0.3s ease both;
    }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; flex-direction: row-reverse; }

    .msg-avatar {
      width: 32px; height: 32px;
      border: 1px solid var(--border2);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      font-family: var(--font-m);
      font-size: 10px;
      color: var(--muted);
      background: var(--surface);
    }

    .msg.ai .msg-avatar {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,212,255,0.05);
    }

    .msg-body { flex: 1; }

    .msg-meta {
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .msg.user .msg-meta { text-align: right; }

    .msg-bubble {
      padding: 14px 18px;
      font-size: 13.5px;
      line-height: 1.75;
      border: 1px solid var(--border);
    }

    .msg.user .msg-bubble {
      background: rgba(0,212,255,0.08);
      border-color: rgba(0,212,255,0.25);
      color: #fff;
    }

    .msg.ai .msg-bubble {
      background: var(--panel);
      border-color: var(--border);
      color: var(--text);
    }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 14px 18px;
      background: var(--panel);
      border: 1px solid var(--border);
      width: fit-content;
    }

    .typing-indicator span {
      width: 6px; height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* Stock card inside message */
    .stock-card {
      margin-top: 12px;
      border: 1px solid var(--border2);
      background: var(--surface);
      overflow: hidden;
    }

    .stock-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(0,212,255,0.04);
    }

    .stock-card-ticker {
      font-family: var(--font-d);
      font-size: 22px;
      letter-spacing: 2px;
      color: #fff;
    }

    .stock-card-dir {
      font-family: var(--font-d);
      font-size: 18px;
      letter-spacing: 1px;
    }

    .stock-card-dir.up { color: var(--green); }
    .stock-card-dir.down { color: var(--red); }

    .stock-card-body {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
    }

    .sc-stat {
      padding: 10px 14px;
      border-right: 1px solid var(--border);
    }

    .sc-stat:last-child { border-right: none; }

    .sc-label {
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1.5px;
      margin-bottom: 4px;
    }

    .sc-value {
      font-family: var(--font-m);
      font-size: 15px;
      font-weight: 500;
      color: #fff;
    }

    .sc-value.pos { color: var(--green); }
    .sc-value.neg { color: var(--red); }

    .conf-bar {
      height: 3px;
      background: var(--border);
      margin-top: 6px;
    }

    .conf-bar-fill {
      height: 100%;
      transition: width 1s ease;
    }

    /* Input area */
    .input-area {
      padding: 16px 28px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      z-index: 10;
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--panel);
      border: 1px solid var(--border2);
      padding: 12px 16px;
      transition: border-color 0.2s;
    }

    .input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px rgba(0,212,255,0.15);
    }

    .chat-input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: #fff;
      font-family: var(--font-b);
      font-size: 13.5px;
      resize: none;
      min-height: 22px;
      max-height: 120px;
      line-height: 1.6;
    }

    .chat-input::placeholder { color: var(--muted); }

    .send-btn {
      background: var(--accent);
      border: none;
      width: 34px; height: 34px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .send-btn:hover { background: #fff; box-shadow: 0 0 16px rgba(0,212,255,0.5); }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

    .send-btn svg {
      width: 16px; height: 16px;
      stroke: #000; fill: none; stroke-width: 2.5;
    }

    .input-hint {
      font-family: var(--font-m);
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 1px;
      margin-top: 8px;
      text-align: center;
    }

    /* Markdown-style in AI messages */
    .msg-bubble strong { color: #fff; font-weight: 500; }
    .msg-bubble em { color: var(--muted); font-style: italic; }
    .msg-bubble .tag-up { color: var(--green); font-family: var(--font-m); font-size: 12px; }
    .msg-bubble .tag-down { color: var(--red); font-family: var(--font-m); font-size: 12px; }
    .msg-bubble .tag-price { color: var(--gold); font-family: var(--font-m); }
    .msg-bubble .tag-pct.pos { color: var(--green); font-family: var(--font-m); }
    .msg-bubble .tag-pct.neg { color: var(--red); font-family: var(--font-m); }

    /* Responsive */
    @media (max-width: 640px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .messages { padding: 20px 16px; }
      .input-area { padding: 12px 16px 16px; }
      .chat-header { padding: 12px 16px; }
    }
  </style>
</head>
<body>
<div class="app">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        </div>
        <div class="logo-name">STOCK<span>SIGNAL</span></div>
      </div>
      <div class="logo-sub">// AI 股票諮詢顧問</div>
    </div>

    <button class="new-chat-btn" onclick="newChat()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      新對話 NEW CHAT
    </button>

    <div class="sidebar-section">
      <div class="section-label">// 快速分析</div>
      <button class="quick-btn" onclick="sendQuick('幫我分析 AAPL 蘋果股票')">
        <span class="qb-ticker">AAPL</span>蘋果公司走勢分析
      </button>
      <button class="quick-btn" onclick="sendQuick('TSLA 特斯拉明天會漲還是跌？')">
        <span class="qb-ticker">TSLA</span>特斯拉明日預測
      </button>
      <button class="quick-btn" onclick="sendQuick('幫我分析台積電 2330.TW')">
        <span class="qb-ticker">2330.TW</span>台積電技術分析
      </button>
      <button class="quick-btn" onclick="sendQuick('NVDA 輝達現在適合買入嗎？')">
        <span class="qb-ticker">NVDA</span>輝達投資建議
      </button>
      <button class="quick-btn" onclick="sendQuick('0050.TW 元大台灣50值得長期持有嗎？')">
        <span class="qb-ticker">0050.TW</span>元大台灣50分析
      </button>

      <div class="section-label">// 問問看</div>
      <button class="quick-btn" onclick="sendQuick('什麼是 RSI 指標？怎麼看？')">什麼是 RSI 指標？</button>
      <button class="quick-btn" onclick="sendQuick('MACD 黃金交叉代表什麼意思？')">MACD 黃金交叉是什麼？</button>
      <button class="quick-btn" onclick="sendQuick('布林通道怎麼判斷買賣時機？')">布林通道怎麼用？</button>
      <button class="quick-btn" onclick="sendQuick('現在市場環境適合做多還是做空？')">現在市場適合做多嗎？</button>
    </div>

    <div class="sidebar-footer">
      <div class="disclaimer-small">
        ⚠ 本工具由 AI 驅動，僅供研究參考。<br>
        不構成任何投資建議或推薦。<br>
        股市有風險，投資需謹慎。
      </div>
    </div>
  </aside>

  <!-- ── CHAT ── -->
  <main class="chat-area">
    <div class="chat-header">
      <div class="chat-title">// STOCKSIGNAL · LSTM + AI ADVISOR</div>
      <div class="status-dot">
        <div class="dot"></div>
        ONLINE
      </div>
    </div>

    <div class="messages" id="messages">
      <!-- Welcome shown before first message -->
      <div class="welcome" id="welcome">
        <div class="welcome-icon">
          <svg viewBox="0 0 24 24"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        </div>
        <div class="welcome-title">STOCK<span>SIGNAL</span></div>
        <div class="welcome-sub">
          你好！我是你的 AI 股票諮詢顧問。<br>
          可以問我任何股票相關問題，或輸入股票代號幫你進行分析預測。
        </div>
        <div class="welcome-chips">
          <div class="chip" onclick="sendQuick('幫我分析 AAPL 的走勢')">📈 分析 AAPL</div>
          <div class="chip" onclick="sendQuick('TSLA 明天會漲嗎？')">🔮 預測 TSLA</div>
          <div class="chip" onclick="sendQuick('台積電 2330.TW 現在適合買入嗎？')">🇹🇼 台積電分析</div>
          <div class="chip" onclick="sendQuick('什麼是布林通道？')">📚 技術指標教學</div>
          <div class="chip" onclick="sendQuick('幫我比較 MSFT 和 GOOGL')">⚖️ 比較兩支股票</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-box">
        <textarea
          class="chat-input"
          id="chatInput"
          placeholder="輸入股票代號或問題... (例：幫我分析 AAPL)"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="input-hint">ENTER 送出 · SHIFT+ENTER 換行 · 僅供參考，非投資建議</div>
    </div>
  </main>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
// 你的 Anthropic API Key（部署時請改用後端代理，不要暴露 key）
const CLAUDE_MODEL = 'claude-sonnet-4-20250514';

const SYSTEM_PROMPT = `你是 StockSignal AI，一個專業的股票諮詢顧問助手。你具備以下能力：

1. **股票分析與預測**：當用戶提及股票代號（如 AAPL、TSLA、2330.TW 等），你會提供詳細的技術面分析、基本面概況、短期趨勢判斷。

2. **技術指標解說**：能清楚解釋 RSI、MACD、布林通道、ATR、OBV、EMA 等技術指標的意義與用法。

3. **投資邏輯分析**：能分析市場環境、產業趨勢、個股特性，給出有條理的投資邏輯。

4. **AI 模型背景**：本系統使用 LSTM 深度學習模型，以 14 項技術特徵（return_1d, log_return, hv_5, hv_20, RSI, MACD, MACD_hist, bb_pct, bb_width, ATR, ema12_dist, ema26_dist, vol_ratio, obv_change）分析過去 60 個交易日序列，預測明日漲跌方向與幅度。

**回應風格**：
- 使用繁體中文回答
- 語氣專業但親切
- 給出具體數字和分析，避免空話
- 在回應末尾加上免責聲明：「⚠️ 以上僅供參考，不構成投資建議。」
- 如果用戶問的是具體股票預測，在分析中包含方向判斷（看漲/看跌）、信心程度、關鍵支撐/壓力位

**重要**：當被問及股票預測時，請根據你對該股票的知識提供分析，同時說明 LSTM 模型的預測邏輯。你不需要真實執行模型，但要根據市場常識給出合理分析。`;

// ── STATE ────────────────────────────────────────────────────────────────────
let history = [];
let isLoading = false;

// ── HELPERS ──────────────────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function scrollBottom() {
  const m = $('messages');
  m.scrollTop = m.scrollHeight;
}

function now() {
  return new Date().toLocaleTimeString('zh-TW', { hour:'2-digit', minute:'2-digit' });
}

// ── DETECT STOCK TICKER ───────────────────────────────────────────────────────
function extractTicker(text) {
  const m = text.match(/\b([A-Z]{1,5}(?:\.[A-Z]{2})?|\d{4}\.TW)\b/);
  return m ? m[1] : null;
}

// ── MOCK STOCK DATA ───────────────────────────────────────────────────────────
function getMockPrediction(ticker) {
  const seed = ticker.split('').reduce((a,c) => a + c.charCodeAt(0), 42);
  const r = (min, max) => min + ((seed * 9301 + 49297) % 233280) / 233280 * (max - min);
  const isUp = r(0,1) > 0.42;
  const mag = isUp ? r(0.2, 4.5) : -r(0.1, 3.8);
  const conf = r(0.54, 0.91);
  const prices = { AAPL:196.45, TSLA:248.3, NVDA:127.8, MSFT:415.2, GOOGL:175.4, AMZN:196.1, META:531.2, '2330.TW':910, '0050.TW':148.5, '2317.TW':188 };
  const cur = prices[ticker] || r(20, 500);
  return {
    ticker,
    direction: isUp ? 'Up' : 'Down',
    magnitude: parseFloat(mag.toFixed(2)),
    confidence: parseFloat(conf.toFixed(4)),
    current_price: parseFloat(cur.toFixed(2)),
    predicted_price: parseFloat((cur * (1 + mag/100)).toFixed(2)),
  };
}

// ── RENDER STOCK CARD ─────────────────────────────────────────────────────────
function stockCardHTML(d) {
  const isUp = d.direction === 'Up';
  const dirLabel = isUp ? '↑ 看漲 BULLISH' : '↓ 看跌 BEARISH';
  const confPct = (d.confidence * 100).toFixed(1);
  const magStr = (d.magnitude >= 0 ? '+' : '') + d.magnitude + '%';
  const fillColor = isUp ? 'var(--green)' : 'var(--red)';

  return `
    <div class="stock-card">
      <div class="stock-card-header">
        <div class="stock-card-ticker">${d.ticker}</div>
        <div class="stock-card-dir ${isUp?'up':'down'}">${dirLabel}</div>
      </div>
      <div class="stock-card-body">
        <div class="sc-stat">
          <div class="sc-label">當前價格</div>
          <div class="sc-value">$${d.current_price}</div>
        </div>
        <div class="sc-stat">
          <div class="sc-label">目標價格</div>
          <div class="sc-value">$${d.predicted_price}</div>
        </div>
        <div class="sc-stat">
          <div class="sc-label">預測幅度</div>
          <div class="sc-value ${isUp?'pos':'neg'}">${magStr}</div>
          <div class="conf-bar">
            <div class="conf-bar-fill" style="width:0%;background:${fillColor}" data-width="${confPct}"></div>
          </div>
          <div class="sc-label" style="margin-top:4px">信心 ${confPct}%</div>
        </div>
      </div>
    </div>`;
}

// ── FORMAT AI TEXT ────────────────────────────────────────────────────────────
function formatText(text) {
  return escHtml(text)
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/↑/g, '<span class="tag-up">↑</span>')
    .replace(/↓/g, '<span class="tag-down">↓</span>')
    .replace(/看漲/g, '<span class="tag-up">看漲</span>')
    .replace(/看跌/g, '<span class="tag-down">看跌</span>')
    .replace(/(\+\d+\.?\d*%)/g, '<span class="tag-pct pos">$1</span>')
    .replace(/(-\d+\.?\d*%)/g, '<span class="tag-pct neg">$1</span>')
    .replace(/(\$[\d,]+\.?\d*)/g, '<span class="tag-price">$1</span>')
    .replace(/\n/g, '<br>');
}

// ── ADD MESSAGE ───────────────────────────────────────────────────────────────
function addMessage(role, text, stockData = null) {
  const welcome = $('welcome');
  if (welcome) welcome.remove();

  const msgs = $('messages');
  const isUser = role === 'user';

  const div = document.createElement('div');
  div.className = `msg ${isUser ? 'user' : 'ai'}`;

  const avatarLabel = isUser ? 'YOU' : 'AI';

  div.innerHTML = `
    <div class="msg-avatar">${avatarLabel}</div>
    <div class="msg-body">
      <div class="msg-meta">${isUser ? 'YOU' : 'STOCKSIGNAL AI'} · ${now()}</div>
      <div class="msg-bubble">${formatText(text)}${stockData ? stockCardHTML(stockData) : ''}</div>
    </div>`;

  msgs.appendChild(div);

  // Animate confidence bars
  if (stockData) {
    setTimeout(() => {
      div.querySelectorAll('.conf-bar-fill').forEach(el => {
        el.style.width = el.dataset.width + '%';
      });
    }, 200);
  }

  scrollBottom();
  return div;
}

// ── TYPING INDICATOR ──────────────────────────────────────────────────────────
function showTyping() {
  const welcome = $('welcome');
  if (welcome) welcome.remove();

  const msgs = $('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `
    <div class="msg-avatar">AI</div>
    <div class="msg-body">
      <div class="msg-meta">STOCKSIGNAL AI · ${now()}</div>
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>`;
  msgs.appendChild(div);
  scrollBottom();
}

function hideTyping() {
  const t = $('typing');
  if (t) t.remove();
}

// ── CALL CLAUDE API ───────────────────────────────────────────────────────────
async function callClaude(userMessage) {
  history.push({ role: 'user', content: userMessage });

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: CLAUDE_MODEL,
      max_tokens: 1000,
      system: SYSTEM_PROMPT,
      messages: history,
    }),
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || `API Error ${response.status}`);
  }

  const data = await response.json();
  const reply = data.content.map(b => b.text || '').join('');
  history.push({ role: 'assistant', content: reply });
  return reply;
}

// ── SEND MESSAGE ──────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = $('chatInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  $('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  addMessage('user', text);
  showTyping();

  // Check for ticker
  const ticker = extractTicker(text.toUpperCase());
  let stockData = null;
  if (ticker && /分析|預測|走勢|漲|跌|買|賣|看|今天|明天|recommend/i.test(text)) {
    stockData = getMockPrediction(ticker);
  }

  try {
    const reply = await callClaude(text);
    hideTyping();
    addMessage('ai', reply, stockData);
  } catch (err) {
    hideTyping();
    addMessage('ai', `⚠ 連線發生錯誤：${err.message}\n\n請確認 API 設定是否正確，或稍後再試。`);
  } finally {
    isLoading = false;
    $('sendBtn').disabled = false;
    input.focus();
  }
}

// ── QUICK SEND ────────────────────────────────────────────────────────────────
function sendQuick(text) {
  $('chatInput').value = text;
  sendMessage();
}
